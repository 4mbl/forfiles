name: CI - Publish

on:
  release:
    types: [created]

env:
  LATEST_PYTHON_VERSION: 3.14

jobs:
  publish:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build package
        run: |
          rm -rf dist
          uv build src/

      - name: Publish to PyPI
        run: |
          uv publish -u __token__ -p ${{ secrets.PYPI_TOKEN }} dist/*

      - name: Attach distributions to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
