name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: 4mbl/actions/.github/workflows/ci-python-uv.yml@5d9a15ed68d13ae6a628351c7cec2f9eb01318e8 # ci-python-uv/v26.11.0
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      wheel-imports: forfiles.fs forfiles.image
